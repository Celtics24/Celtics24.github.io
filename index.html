<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study Coach</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Coach">
<meta name="theme-color" content="#ffe3ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --ds-page:#fbfaf9; --ds-white:#ffffff; --ds-ink:#251f21; --ds-ink-2:#585254;
  --ds-ink-3:#969394; --ds-hairline:#eae9ea;
  --pink-50:#fff5fa; --pink-100:#ffe3ef; --pink-200:#ffc9de; --pink-300:#ff9ec4; --pink-600:#d6336c; --pink-700:#c2255c;
  --ds-elevation-1: 0 1px 2px rgb(37 31 33 / .12), 0 4px 12px rgb(37 31 33 / .14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--ds-page); color:var(--ds-ink);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Hebrew",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.file-card{
  max-width:680px;margin:24px auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px calc(104px + env(safe-area-inset-bottom,0px));background:var(--ds-white);
  border-radius:24px;box-shadow:var(--ds-elevation-1);
}
@media (max-width:740px){ .file-card{margin:0;border-radius:0;min-height:100vh;} }
.file-header{margin-bottom:14px;position:relative}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.tabs-inner{pointer-events:auto;width:100%;max-width:680px;display:flex;gap:4px;background:rgb(255 255 255 / .94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1.5px solid var(--pink-200);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:16px;text-decoration:none;color:var(--ds-ink-3);font-size:11px;font-weight:700}
.tab-ico{width:24px;height:24px;fill:none;stroke:var(--pink-600);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tab.is-active .tab-ico{stroke:var(--pink-700)}
.last-nb{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 16px;border-radius:20px;border:1.5px solid var(--pink-200);background:var(--pink-50);color:var(--ds-ink);text-decoration:none}.last-nb .tab-ico{width:32px;height:32px;flex:none;stroke:var(--pink-700)}.last-nb-text{display:flex;flex-direction:column;gap:2px;min-width:0}.last-nb-text strong{font-size:17px;overflow-wrap:anywhere}.last-nb-text small{font-size:12px;color:var(--ds-ink-2)}
.tab.is-active{color:var(--pink-700);background:var(--pink-100)}
.page-title{margin:0 0 4px;font-size:28px;font-weight:800}
.settings-lead{font-size:13.5px;color:var(--ds-ink-2);margin:0 0 4px}
.owner-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.owner-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--pink-200);border-radius:14px;padding:10px 12px}
.owner-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.owner-sub{font-size:12.5px;color:var(--ds-ink-2)}
.owner-row .file-button{margin-top:0;white-space:nowrap;padding:8px 12px;font-size:13.5px}
.file-title{margin:0;font-size:28px;font-weight:800}
.file-fact{margin-top:2px;font-size:13px;color:var(--ds-ink-2)}
.group{margin-top:20px}
.group-label{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ds-ink-2)}
.caption{font-size:12px;color:var(--ds-ink-2);margin-top:8px}
.closing{margin-top:26px;text-align:center;font-size:12px;color:var(--ds-ink-3)}
.file-button{display:inline-block;font:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;
  border:1.5px solid var(--pink-300);background:var(--pink-100);color:var(--pink-700);cursor:pointer;text-decoration:none}
.file-button[data-variant="secondary"]{background:#fff}
.file-button:hover{border-color:var(--pink-600)}
.file-hover-wrap{text-decoration:none}
.file-hover-underline:hover{text-decoration:underline}
.next-exam{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;border-radius:22px;
  background:linear-gradient(135deg,var(--pink-100),var(--pink-200));border:1px solid var(--pink-300);margin-bottom:6px}
.next-label{font-size:13px;font-weight:700;color:var(--pink-700)}
.next-count-row{display:flex;align-items:baseline;gap:8px}
.next-num{font-size:52px;font-weight:800;line-height:1;color:var(--pink-700);font-variant-numeric:tabular-nums}
.next-word{font-size:20px;font-weight:700;color:var(--pink-700)}
.next-word.is-big{font-size:40px;font-weight:800;line-height:1.05}
.next-name{font-size:16px;font-weight:600;color:var(--ds-ink)}
.next-date{font-size:13px;color:var(--ds-ink-2)}
.next-link{margin-top:4px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--pink-200);border-radius:999px;padding:11px 16px;margin:14px 0 4px}
.search:focus-within{border-color:var(--pink-300)}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;background:transparent;color:var(--ds-ink)}
.search input::placeholder{color:var(--ds-ink-2)}
.no-results{font-size:14px;color:var(--ds-ink-2);text-align:center;padding:18px 0}
.pbar-wrap{display:flex;flex-direction:column;gap:6px;width:100%}
.pbar{height:10px;border-radius:999px;background:#fff;border:1px solid var(--pink-200);overflow:hidden}
.pbar>span{display:block;height:100%;background:var(--pink-600);border-radius:999px;transition:width .3s ease}
.pbar-text{font-size:12px;font-weight:600;color:var(--ds-ink-2)}
.sprint{display:flex;flex-direction:column;gap:10px}
.sprint-card{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:16px;border:1px solid transparent;text-decoration:none;color:inherit}
.sprint-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sprint-name{font-weight:700;font-size:14px;color:var(--ds-ink)}
.sprint-days{font-size:12px;font-weight:700;white-space:nowrap}
.exams{display:flex;flex-direction:column}
.exam-row{display:block;padding:12px 0;border-bottom:1px solid var(--ds-hairline);text-decoration:none;color:inherit}
.exam-row:last-child{border-bottom:0}
.exam-flex{display:flex;align-items:center;gap:14px}
.exam-date{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:6px 8px;background:var(--pink-100);border-radius:14px;color:var(--pink-700)}
.exam-date strong{font-size:20px;line-height:1.1}
.exam-date span{font-size:11px}
.exam-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.exam-name{font-weight:600;font-size:14px;color:var(--ds-ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.exam-pill{font-size:10px;font-weight:700;background:var(--pink-100);color:var(--pink-700);border-radius:999px;padding:2px 8px}
.exam-meta{font-size:12px;color:var(--ds-ink-2)}
.exam-count{font-size:13px;font-weight:600;color:var(--pink-700);white-space:nowrap}
.month{border:1px solid var(--pink-200);border-radius:16px;overflow:hidden;background:#fff}
.month-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--pink-100);color:var(--pink-700);font-size:12px;font-weight:600;text-align:center}
.month-head>div{padding:8px 0}
.month-week{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--ds-hairline)}
.month-day{min-height:52px;padding:4px 2px;text-align:center;border-inline-start:1px solid var(--ds-hairline);display:flex;flex-direction:column;align-items:center;gap:2px}
.month-day:first-child{border-inline-start:0}
.month-num{font-size:12px;font-weight:600;color:var(--ds-ink)}
.month-day.has-exam{background:var(--pink-50)}
.month-day.has-exam .month-num{color:var(--pink-700)}
.month-exam{font-size:9px;line-height:1.2;background:var(--pink-200);color:var(--pink-700);border-radius:6px;padding:1px 4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.month-day.is-today{outline:2px solid var(--pink-300);outline-offset:-2px;border-radius:8px}
.summaries{display:flex;flex-direction:column;gap:10px}
.summary-row{display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:#fff;border:1px solid var(--ds-hairline);border-radius:16px}
.summary-top{display:flex;align-items:center;gap:12px}
.summary-chip{display:flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:12px;border:1px solid transparent;font-size:20px}
.summary-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.summary-name{font-weight:600;font-size:14px;color:var(--ds-ink);text-decoration:none;align-self:flex-start}
.summary-row.is-studied .summary-name{color:var(--ds-ink-2)}
.summary-note{font-size:12px;color:var(--ds-ink-2)}
.summary-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.studied-toggle{min-height:40px;flex-shrink:0;font:inherit;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;border:1.5px solid var(--pink-300);background:#fff;color:var(--pink-700);cursor:pointer;margin-inline-start:auto}
.studied-toggle.is-on{color:#fff;border-width:1.5px}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:768px){.subjects{grid-template-columns:repeat(4,1fr)}}
.subject{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;background:var(--pink-50);border:1px solid var(--pink-200);border-radius:16px;text-decoration:none;color:inherit}
.subject-emoji{font-size:22px}
.subject-name{font-weight:600;font-size:14px;color:var(--ds-ink)}
.subject-count{font-size:12px;color:var(--ds-ink-2)}
.back-link{align-self:flex-start;margin-bottom:12px;min-height:40px;display:inline-flex;align-items:center}
.subject-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.subject-head-emoji{font-size:34px}
.subject-head-name{font-size:26px;font-weight:800;color:var(--ds-ink)}
.subj-exam{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:16px;border:1px solid transparent;margin-bottom:14px}
.subj-exam-name{font-weight:700;font-size:15px;color:var(--ds-ink)}
.subj-exam-meta{font-size:13px;color:var(--ds-ink-2)}
.hero-wrap{max-width:460px;margin:0 auto;border-radius:24px;overflow:hidden;border:1.5px solid var(--pink-200);background:#f0ebef;box-shadow:0 6px 20px rgb(214 51 108 / .10)}
.hero-wrap img{display:block;width:100%;height:auto}
.streak-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--pink-50),var(--pink-100));border:1.5px solid var(--pink-200);border-radius:22px;padding:14px 18px;margin-top:14px}
@keyframes streak-pop{0%{transform:scale(.35);opacity:.2}60%{transform:scale(1.22);opacity:1}100%{transform:scale(1)}}
.streak-flame{font-size:30px;animation:streak-pop .6s ease}
.streak-num{font-size:34px;font-weight:800;color:var(--pink-700);min-width:42px;text-align:center;animation:streak-pop .5s ease}
.streak-text{display:flex;flex-direction:column;gap:2px}
.streak-label{font-weight:700}
.streak-best{font-size:12.5px;color:var(--pink-600)}
.reminders-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff8dd,#ffefd9);border:1.5px solid #f3e7b4;border-radius:22px;padding:14px 18px;margin-top:14px}
.reminders-emoji{font-size:26px}
.reminders-text{flex:1;display:flex;flex-direction:column;gap:2px}
.reminders-title{font-weight:700}
.reminders-sub{font-size:12.5px;color:#8a6d3b}
.reminders-btn{border:1.5px solid var(--pink-200);background:#fff;color:var(--pink-700);font-weight:700;border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}
.sync-card{background:linear-gradient(135deg,#f3e9ff,#ffe9f4);border-color:#e4cdf5}
.sync-code{direction:ltr;display:inline-block;font-size:20px;font-weight:800;letter-spacing:3px;background:#fff;border:1.5px dashed #d9a5e0;border-radius:12px;padding:4px 12px;margin-top:6px}
.sync-input{direction:ltr;font-size:16px;letter-spacing:2px;padding:7px 10px;border-radius:12px;border:1.5px solid #e0b8e8;width:140px;text-align:center;font-family:inherit}
.sync-error{color:#c0392b;font-size:13px}
.sync-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
.reminders-btn.is-on{background:var(--pink-700);border-color:var(--pink-700);color:#fff}
.reminders-btn:disabled{opacity:.6}
.streak-hint{margin-inline-start:auto;font-size:11px;color:#c49bae;text-align:left}
.hero-gap{margin-top:14px}

[hidden]{display:none!important}
:root[data-theme="blue"]{--ds-page:#f6faff;--ds-ink:#182d49;--ds-ink-2:#49617e;--pink-50:#f0f7ff;--pink-100:#e0efff;--pink-200:#bedbff;--pink-300:#8dbbfa;--pink-600:#377dc7;--pink-700:#235b96}
:root[data-theme="blue"] .sync-card{background:linear-gradient(135deg,#edf4ff,#dcecff);border-color:#bedbff}
:root[data-theme="blue"] .reminders-card:not(.sync-card){background:#eef6ff;border-color:#bedbff}
:root[data-theme="blue"] .reminders-sub{color:#49617e}
:root[data-theme="blue"] .hero-wrap{box-shadow:0 6px 20px rgb(35 91 150 / .10)}
.theme-options{display:flex;gap:12px}.theme-option{min-height:48px;border:2px solid transparent;border-radius:16px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer}.theme-option[aria-pressed="true"]{outline:2px solid var(--pink-700);outline-offset:3px}
.onboard{display:flex;flex-direction:column;gap:18px;padding-top:22px}.onboard h1{margin:0}.onboard input,.onboard textarea,.timetable-editor{width:100%;font:inherit;min-height:48px;border:1.5px solid var(--pink-200);border-radius:14px;padding:12px;background:#fff;color:var(--ds-ink)}.onboard textarea{min-height:130px;resize:vertical}.onboard label{font-size:14px;font-weight:600;display:grid;gap:8px}.onboard .file-button{min-height:48px;text-align:center}.form-error{color:#b22636;font-size:13px}.timetable-editor{min-height:120px;margin:10px 0;white-space:pre-wrap}.save-state{font-size:12px;color:var(--ds-ink-2);min-height:16px}
.add-link-first{display:block;width:100%;min-height:48px;margin-bottom:22px}.privacy-note p{font-size:13px;line-height:1.7;color:var(--ds-ink-2)}.fold{margin-bottom:14px}.fold summary{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ds-ink);padding:10px 0;list-style:none}.fold summary::-webkit-details-marker{display:none}.fold summary::after{content:"⌄";color:var(--ds-ink-2);transition:transform .15s ease}.fold[open] summary::after{transform:rotate(180deg)}:root[dir="ltr"] .streak-hint{text-align:right}.danger{color:#b22636;border-color:#e1a6ae;background:#fff5f5}.confirm-panel{margin-top:14px;padding:16px;border:1px solid #e1a6ae;border-radius:16px}.confirm-panel label{display:block;margin-bottom:14px}.add-link-form{display:grid;gap:12px;padding:18px;background:var(--pink-50);border:1px solid var(--pink-200);border-radius:18px;margin-bottom:18px}.add-link-form label{display:grid;gap:6px;font-size:14px}.add-link-form input,.add-link-form select{width:100%;font:inherit;min-height:46px;border-radius:12px;border:1px solid var(--pink-200);padding:10px;background:#fff;color:var(--ds-ink)}

:root[data-theme="purple"]{--ds-page:#faf7ff;--ds-ink:#30213e;--ds-ink-2:#625173;--pink-50:#f8f3ff;--pink-100:#eee5ff;--pink-200:#d8c5f5;--pink-300:#b897e1;--pink-600:#8a5bc1;--pink-700:#6841a3}
:root[data-theme="mint"]{--ds-page:#f5fbf8;--ds-ink:#203a30;--ds-ink-2:#4d6b5f;--pink-50:#effaf5;--pink-100:#def5eb;--pink-200:#b6dfcd;--pink-300:#85c4aa;--pink-600:#368060;--pink-700:#276b52}
:root[data-theme="burgundy"]{--ds-page:#f8f1f2;--ds-ink:#2b0b14;--ds-ink-2:#6b3a47;--pink-50:#f3e6e8;--pink-100:#e9d0d5;--pink-200:#cfa3ac;--pink-300:#a45c6b;--pink-600:#6b1427;--pink-700:#4a0d1b}
:root[data-theme="dark"]{color-scheme:dark;--ds-page:#121a27;--ds-white:#192536;--ds-ink:#e8effb;--ds-ink-2:#b9c8dc;--ds-ink-3:#96aac3;--ds-hairline:#34465e;--pink-50:#1d2b3e;--pink-100:#243349;--pink-200:#405570;--pink-300:#607fa4;--pink-600:#aacbfa;--pink-700:#d0e3ff}
:root:not([data-theme="pink"]) .sync-card,:root:not([data-theme="pink"]) .reminders-card{background:var(--pink-50);border-color:var(--pink-200)}
:root:not([data-theme="pink"]) .reminders-sub,:root:not([data-theme="pink"]) .streak-hint{color:var(--ds-ink-2)}
:root[data-theme="dark"] .tabs-inner{background:rgb(25 37 54 / .96)}
:root[data-theme="dark"] :is(.summary-row,.search,.month,.pbar,.file-button[data-variant="secondary"],.reminders-btn,.sync-code,.sync-input,.onboard input,.onboard textarea,.timetable-editor,.add-link-form input,.add-link-form select){background:var(--ds-white);color:var(--ds-ink)}
:root[data-theme="dark"] .subject{background:var(--pink-50)!important;border-color:var(--pink-200)!important}
:root[data-theme="dark"] .subject-count,:root[data-theme="dark"] .subj-exam-meta{color:var(--ds-ink-2)!important}
:root[data-theme="dark"] .subj-exam,:root[data-theme="dark"] .summary-row.is-studied{background:var(--pink-50)!important;border-color:var(--pink-200)!important}
:root[data-theme="dark"] .summary-chip{color:#243349}
:root[data-theme="dark"] .danger{background:#35232c;color:#ffb7c2;border-color:#a56c79}
.theme-options{flex-wrap:wrap}.theme-option{flex:1 1 28%;min-width:90px}

:root[data-theme="dark"] .sprint-card{background:var(--pink-50)!important;border-color:var(--pink-200)!important}
:root[data-theme="dark"] :is(.sprint-days,.exam-count){color:var(--pink-700)!important}
:root[data-theme="dark"] .studied-toggle:not(.is-on){background:var(--ds-white);color:var(--pink-700)}
:root[data-theme="dark"] .reminders-btn.is-on{background:var(--pink-700);color:#192536}
:root[data-theme="dark"] :is(.form-error,.sync-error){color:#ffb7c2}

.photo-panel{display:grid;gap:12px;padding:16px;border:1px solid var(--pink-200);background:var(--pink-50);border-radius:18px;margin-bottom:20px}
.photo-panel label{display:grid;gap:6px;font-size:14px;font-weight:600}.photo-panel :is(input,select,textarea){width:100%;min-height:46px;font:inherit;padding:10px;border:1px solid var(--pink-200);border-radius:12px;background:var(--ds-white);color:var(--ds-ink)}
.photo-panel textarea{min-height:260px;line-height:1.8;unicode-bidi:plaintext;resize:vertical}.photo-panel img{max-width:100%;max-height:280px;object-fit:contain;justify-self:center;border-radius:10px}.photo-actions{display:flex;gap:8px;flex-wrap:wrap}.photo-hint{font-size:12px;line-height:1.65;color:var(--ds-ink-2);margin:0}.photo-panel input[type=checkbox]{width:auto;min-height:0}.photo-panel .review-consent{display:flex;align-items:flex-start;gap:8px}.text-reading{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;unicode-bidi:plaintext}.photo-status{font-size:13px;color:var(--pink-700)}

<script>
"use strict";
let ROOT='', COUNCIL_ID='';
const folder=id=>`https://drive.google.com/drive/folders/${id}`;
const PROGRESS_DAYS=3;
const C={
  pink:{bg:'#ffe3ef',border:'#ffc9de',accent:'#c2255c'},
  lavender:{bg:'#f3edff',border:'#ddd0fa',accent:'#6d4fb0'},
  mint:{bg:'#e6f7ef',border:'#c9ecdd',accent:'#2f8f5b'},
  sky:{bg:'#e8f3ff',border:'#cde5fb',accent:'#2b6cb0'},
  peach:{bg:'#fff0e4',border:'#fbdfc6',accent:'#b85c17'},
  lemon:{bg:'#fff8dd',border:'#f3e7b4',accent:'#7a6116'},
  sand:{bg:'#faf3e7',border:'#ecdfc6',accent:'#8a6d3b'},
  clay:{bg:'#fbeaea',border:'#f1d3d3',accent:'#a34a4a'},
  teal:{bg:'#e5f6f9',border:'#c6e9f1',accent:'#1f7a8c'},
  rose:{bg:'#ffe9ee',border:'#f7cbd5',accent:'#c94f6d'},
  orange:{bg:'#ffefe2',border:'#fadbc2',accent:'#b35c1e'},
  green:{bg:'#ebf7e4',border:'#d3eac3',accent:'#4a7c2f'},
  peri:{bg:'#eef0ff',border:'#d8dcfb',accent:'#5a67b8'},
};
let subjects=[], exams=[], summaries=[], councilItems=[];
const hebDays=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const hebMonths=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function daysUntil(ex){const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();const target=new Date(ex.y,ex.m-1,ex.d).getTime();return Math.round((target-today)/86400000);}
function countdown(ex){const d=daysUntil(ex);if(d<0)return 'עבר';if(d===0)return 'היום!';if(d===1)return 'מחר!';return `עוד ${d} ימים`;}
function examWeekday(ex){return `יום ${hebDays[new Date(ex.y,ex.m-1,ex.d).getDay()]}`;}
function subjectSummaries(n){return summaries.filter(s=>s.subject===n);}
function nextExamFor(n){return exams.filter(ex=>ex.subject===n&&daysUntil(ex)>=0).sort((a,b)=>daysUntil(a)-daysUntil(b))[0];}
const IL_DAY=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem'});
function todayKey(){return IL_DAY.format(new Date());}
function shiftDayKey(key,delta){const [y,m,d]=key.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+delta)).toISOString().slice(0,10);}
function computeStreaks(days){
  const set=new Set(Object.keys(days).filter(k=>days[k]));
  let cursor=set.has(todayKey())?todayKey():shiftDayKey(todayKey(),-1);
  let current=0;
  while(set.has(cursor)){current++;cursor=shiftDayKey(cursor,-1);}
  let best=0,run=0,prev='';
  for(const k of [...set].sort()){run=prev&&k===shiftDayKey(prev,1)?run+1:1;if(run>best)best=run;prev=k;}
  return {current,best};
}
const store={
  get studied(){try{return JSON.parse(localStorage.getItem('studied.v1')||'{}')}catch(e){return {}}},
  set studied(v){localStorage.setItem('studied.v1',JSON.stringify(v))},
  get days(){try{return JSON.parse(localStorage.getItem('studyDays.v1')||'{}')}catch(e){return {}}},
  set days(v){localStorage.setItem('studyDays.v1',JSON.stringify(v))},
};
function markStudyDay(){const d=store.days;d[todayKey()]=true;store.days=d;
  if(window.syncLocalChanged)window.syncLocalChanged();
  if(window.reportStudyDay){const {current}=computeStreaks(d);window.reportStudyDay(todayKey(),current);}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function lastNotebookHtml(){
  const p=window.boardProfile&&window.boardProfile(),bs=(p&&p.notebooks)||[];if(!bs.length)return '';
  let id='';try{id=localStorage.getItem('sc-last-notebook')||'';}catch(e){}
  const n=bs.find(b=>b.id===id)||bs.slice().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))[0];
  const s=(p.subjects||[]).find(x=>x.key===n.subjectKey);
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  return `<a class="last-nb" href="#/notebooks/${esc(n.id)}"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3.5" width="12.5" height="17" rx="2"/><path d="M6 8H3.5M6 12H3.5M6 16H3.5M10 8.5h5.5M10 12h5.5"/></svg><span class="last-nb-text"><small>המחברת האחרונה</small><strong>${esc(n.title)}</strong><small>${esc(s&&s.name||'')} · ${n.pages.length} דפים</small></span></a>`;
}
function streakHtml(){
  const {current,best}=computeStreaks(store.days);
  return `<div class="streak-card"><span class="streak-num">${current}</span><span class="streak-text"><span class="streak-label">${current===1?'יום רצף':'ימי רצף'}</span><span class="streak-best">השיא שלך: ${best}</span></span><span class="streak-hint">יום נספר עם ״למדתי״</span></div>`;
}
function nextExamHtml(){
  const upcoming=exams.filter(ex=>!ex.far&&daysUntil(ex)>=0);
  if(!upcoming.length)return '';
  const min=Math.min(...upcoming.map(daysUntil));
  const sameDay=upcoming.filter(ex=>daysUntil(ex)===min);
  const first=sameDay[0];
  return `<div class="next-exam"><span class="next-label">המבחן הקרוב</span>
    <div class="next-count-row">${min>1?`<span class="next-num">${min}</span><span class="next-word">ימים</span>`:min===1?`<span class="next-word is-big">מחר!</span>`:`<span class="next-word is-big">היום! בהצלחה</span>`}</div>
    <span class="next-name">${sameDay.map(ex=>ex.name).join(' + ')}</span>
    <span class="next-date">${examWeekday(first)}, ${first.d} ב${hebMonths[first.m-1]}${first.time?` · ${first.time}`:''}</span>
    ${first.url?`<a class="file-button next-link" href="${first.url}" target="_blank" rel="noreferrer">${first.hasSummary?'פתחי את הסיכום':'פתחי את תיקיית המקצוע'}</a>`:''}
  </div>`;
}
function progressHtml(done,total,color){
  const pct=total>0?Math.round(done/total*100):0;
  return `<div class="pbar-wrap"><div class="pbar" style="border-color:${color.border}" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span style="width:${pct}%;background:${color.accent}"></span></div><span class="pbar-text">${total>0?`למדת ${done} מתוך ${total} סיכומים · ${pct}%`:'עוד אין סיכומים במקצוע'}</span></div>`;
}
function sprintHtml(){
  const studied=store.studied;
  const inWindow=exams.filter(ex=>ex.subject&&!ex.far&&daysUntil(ex)>=0&&daysUntil(ex)<=PROGRESS_DAYS);
  if(!inWindow.length)return '';
  const cards=inWindow.map(ex=>{
    const subj=subjects.find(s=>s.name===ex.subject);
    const linked=(ex.summaryIds||[]).map(id=>summaries.find(x=>x.id===id)).filter(Boolean);
    const list=linked.length?linked:subjectSummaries(ex.subject);
    const done=list.filter(s=>studied[s.id]).length;
    const days=daysUntil(ex);
    return `<a href="#/subject/${subj.key}" class="sprint-card" style="background:${subj.color.bg};border-color:${subj.color.border}">
      <span class="sprint-head"><span class="sprint-name">${ex.name}</span><span class="sprint-days" style="color:${subj.color.accent}">${days===0?'היום!':days===1?'מחר!':`עוד ${days} ימים`}</span></span>
      ${progressHtml(done,list.length,subj.color)}</a>`;
  }).join('');
  return `<section class="group"><h2 class="group-label">הספרינט האחרון ⏳</h2><div class="sprint">${cards}</div></section>`;
}
function monthWeeks(y,m){
  const first=new Date(y,m-1,1);const days=new Date(y,m,0).getDate();
  const weeks=[];let week=new Array(first.getDay()).fill(null);
  for(let d=1;d<=days;d++){week.push(d);if(week.length===7){weeks.push(week);week=[];}}
  if(week.length){while(week.length<7)week.push(null);weeks.push(week);}
  return weeks;
}
let novExams={};
function novemberHtml(){
  const weeks=monthWeeks(2026,11);
  const now=new Date();
  const isThisMonth=now.getFullYear()===2026&&now.getMonth()===10;
  const today=now.getDate();
  const head=hebDays.map(d=>`<div>${d}</div>`).join('');
  const body=weeks.map(week=>`<div class="month-week">${week.map(day=>{
    const marks=day?novExams[day]:undefined;
    const cls=['month-day',day===null?'is-empty':'',marks?'has-exam':'',isThisMonth&&day===today?'is-today':''].join(' ');
    return `<div class="${cls}">${day!==null?`<span class="month-num">${day}</span>`:''}${marks?marks.map(mk=>`<span class="month-exam" style="background:${mk.c.bg};color:${mk.c.accent}">${mk.t}</span>`).join(''):''}</div>`;
  }).join('')}</div>`).join('');
  return `<div class="month" role="table" aria-label="יומן נובמבר 2026"><div class="month-head" role="row">${head}</div>${body}</div>`;
}
function examLinksHtml(ex){
  const ids=ex.summaryIds||[];if(!ids.length)return '';
  const list=ids.map(id=>summaries.find(s=>s.id===id)).filter(Boolean);if(!list.length)return '';
  return `<span class="exam-links-row">${list.map(s=>`<a class="exam-chip" href="${s.type==='text'?'#/text/'+s.id:s.url}" ${s.type==='text'?'':'target="_blank" rel="noreferrer"'}>${s.name}</a>`).join('')}</span>`;
}
function examBoardHtml(){
  const sorted=exams.map((ex,i)=>({ex,i})).sort((a,b)=>new Date(a.ex.y,a.ex.m-1,a.ex.d)-new Date(b.ex.y,b.ex.m-1,b.ex.d));
  return `<div class="exams">${sorted.map(({ex,i})=>{
    const chipStyle=ex.color?`background:${ex.color.bg};color:${ex.color.accent}`:'';
    const inner=`<span class="exam-date" style="${chipStyle}"><strong>${ex.d}</strong><span>${hebMonths[ex.m-1]}${ex.far?` ${ex.y}`:''}</span></span>
      <span class="exam-body"><span class="exam-name">${ex.name}${ex.hasSummary?`<span class="exam-pill" style="${chipStyle}">יש סיכום</span>`:''}</span>
      <span class="exam-meta">${examWeekday(ex)}${ex.time?` · ${ex.time}`:''}${ex.detail?` · ${ex.detail}`:''}</span></span>
      <span class="exam-count" style="${ex.color?`color:${ex.color.accent}`:''}">${countdown(ex)}</span>`;
    const row=ex.url
      ?`<a class="exam-row file-hover-wrap" href="${ex.url}" target="_blank" rel="noreferrer"><span class="file-hover-underline exam-flex">${inner}</span></a>`
      :`<div class="exam-row"><span class="exam-flex">${inner}</span></div>`;
    return `<div class="exam-item">${row}${examLinksHtml(ex)}<button type="button" class="exam-edit" data-exam-edit="${i}">עריכה</button></div>`;
  }).join('')}</div>`;
}
function summaryRowHtml(s){
  const studied=store.studied;
  const on=!!studied[s.id];
  return `<div class="summary-row ${on?'is-studied':''}" ${on?`style="background:${s.color.bg};border-color:${s.color.border}"`:''}>
    <span class="summary-top">
      <span class="summary-body"><a class="summary-name file-hover-wrap" href="${s.type==='text'?'#/text/'+s.id:s.url}" ${s.type==='text'?'':'target="_blank" rel="noreferrer"'}><span class="file-hover-underline">${s.name}</span></a>
      <span class="summary-note">${s.note}</span></span></span>
    <span class="summary-actions"><button type="button" class="studied-toggle ${on?'is-on':''}" ${on?`style="background:${s.color.accent};border-color:${s.color.accent}"`:''} data-toggle="${s.id}" aria-pressed="${on}">${on?'למדתי!':'למדתי?'}</button></span>
  </div>`;
}
function summaryListHtml(items){
  return `<div class="summaries">${items.map(summaryRowHtml).join('')}</div>`;
}
function subjectTileHtml(s){
  const count=subjectSummaries(s.name).length;
  return `<a href="#/subject/${s.key}" class="subject" style="background:${s.color.bg};border-color:${s.color.border}">
    <span class="subject-name">${s.name}</span>
    <span class="subject-count" style="color:${s.color.accent}">${count>0?`${count} סיכומים`:'עדיין ריקה'}</span></a>`;
}
function searchResultsHtml(q){
  const query=q.trim();
  const ms=summaries.filter(s=>s.name.includes(query)||s.subject.includes(query)||s.note.includes(query)||(s.type==='text'&&String(s.text||'').includes(query)));
  const mj=subjects.filter(s=>s.name.includes(query));
  let out='';
  if(mj.length)out+=`<section class="group"><h2 class="group-label">מקצועות</h2><div class="subjects">${mj.map(subjectTileHtml).join('')}</div></section>`;
  if(ms.length)out+=`<section class="group"><h2 class="group-label">סיכומים</h2>${summaryListHtml(ms)}</section>`;
  if(!mj.length&&!ms.length)out=`<p class="no-results">לא נמצאו תוצאות ל״${query}״</p>`;
  return out;
}
function settingsHtml(){
  return `
  <header class="file-header"><h1 class="file-title">הגדרות</h1></header>
  <section class="group"><h2 class="group-label">צבע האפליקציה</h2><div id="theme-picker"></div></section><section class="group"><h2 class="group-label">שפה · Language</h2><div id="language-picker"></div></section><section class="group"><details class="fold"><summary>אבטחת גישה</summary><div id="security-settings"></div></details></section><section class="group"><details class="fold"><summary>מערכת השעות</summary><div id="timetable-settings"></div></details></section>
  <section class="group"><details class="fold"><summary>חיבור בין מכשירים</summary><div id="sync-card"></div></details></section>
  <section class="group"><h2 class="group-label">פרופיל</h2><div id="friends-profile"></div></section>
  <section class="group"><h2 class="group-label">התראות</h2><div id="reminders-card"></div></section>
  <section class="group" id="owner-group" hidden><details class="fold"><summary>ניהול האפליקציה</summary><div id="owner-admin"></div></details></section>
  <section class="group privacy-note"><h2 class="group-label">פרטיות</h2><details class="fold"><summary>מדיניות פרטיות</summary><p>המקצועות, הקישורים, מערכת השעות, העדפות הצבע ונתוני הלמידה נשמרים בפרופיל בשרת ובמכשירים שחוברו אליו. הרשמה להתראות שומרת גם כתובת משלוח טכנית. קבצים מקושרים נשארים בדרייב ובהרשאות שלו. שם פרטי ושם משפחה שנשמרים בפרופיל נראים לאחרים רק אם בחרת להיות ניתנת לחיפוש. חברים שאישרת רואים שמות של מחברות וסיכומים בלבד, ותוכן עובר רק באישור על כל פריט, כעותק שנשאר אצל מי שקיבלה. סיכומי טקסט מצילום נשמרים בפרופיל. צילום לוח נשלח רק באישור לעיבוד זמני ב-Cloudflare, ללא שמירת התמונה באפליקציה או ביומני תוכן. השירות אינו משתמש בתוכן לאימון, בכפוף לחריגי אבטחה וחוק. PDF נוצר במכשיר. מוני שימוש יומיים ללא התמונה או הטקסט נשמרים בנפרד עד לאיפוס היומי (00:02 UTC).</p><p>מנהלת האפליקציה (בעלת האתר) רואה רשימת פרופילים עם שם, תאריך הצטרפות ומצב חסימה בלבד, ויכולה להשבית פרופיל; אין לה גישה לתוכן של משתמשים. קוד החיבור ומפתח השחזור מעניקים גישה לפרופיל. שמרו אותם פרטיים. מחיקת הפרופיל מסירה את נתוניו הפעילים בשרת ואת העותק במכשיר הזה, ולא מוחקת קבצים בדרייב, גיבויים פרטיים או עותקים במכשירים אחרים. אין כאן מערכת חשבונות מלאה.</p><p>תוכן ישן עשוי עדיין להופיע בהיסטוריית הקוד הציבורית, שטרם נוקתה.</p></details><button class="file-button danger" id="delete-profile">מחיקת פרופיל</button><div id="delete-confirm"></div></section>`;
}
function homeHtml(){
  return `
  <header class="file-header"><h1 class="file-title">Study Coach</h1><div class="file-fact">עודכן 20 באוקטובר</div></header>
  ${nextExamHtml()}
  ${sprintHtml()}
  ${lastNotebookHtml()}
  ${streakHtml()}
  `;
}
function summariesPageHtml(){
  return `
  <button class="file-button add-link-first" id="add-file">הוספת קובץ</button><div id="add-file-form"></div><button class="file-button add-link-first" id="photo-board">צילום לוח ל-PDF</button><div id="photo-workspace"></div>
  <header class="file-header"><h1 class="file-title">סיכומים</h1></header>
  <div class="search" role="search"><input id="search-input" type="search" placeholder="חיפוש סיכום או מקצוע…" aria-label="חיפוש סיכום או מקצוע"></div>
  <div id="home-below"></div>`;
}
function examsPageHtml(){
  return `
  <header class="file-header"><h1 class="file-title">מבחנים</h1></header>
  ${nextExamHtml()}
  <section class="group"><h2 class="group-label">לוח מבחנים</h2><button class="file-button add-link-first" id="exam-add" type="button">הוספת מבחן</button><div id="exam-form-box"></div>${examBoardHtml()}</section>
  <section class="group"><h2 class="group-label">נובמבר 2026</h2>${novemberHtml()}</section>`;
}
function homeBelowHtml(q){
  if(q&&q.trim().length>0)return searchResultsHtml(q);
  return `
  <section class="group"><h2 class="group-label">המקצועות שלי</h2><div class="subjects">${subjects.map(subjectTileHtml).join('')}</div>
    ${window.userHasDriveRoot?`<div style="margin-top:10px"><a class="file-button" data-variant="secondary" href="${ROOT}" target="_blank" rel="noreferrer">פתחי את כל התיקייה בדרייב</a></div>`:''}</section>
  <section class="group"><h2 class="group-label">הסיכומים שלי</h2>${summaryListHtml(summaries)}</section>
  ${councilItems.length?`<section class="group"><h2 class="group-label">מועצת תלמידים</h2>
    <div class="summaries">${councilItems.map(item=>`
      <div class="summary-row"><span class="summary-top">
      <span class="summary-body"><a class="summary-name file-hover-wrap" href="${item.url}" target="_blank" rel="noreferrer"><span class="file-hover-underline">${item.name}</span></a>
      <span class="summary-note">${item.note}</span></span></span></div>`).join('')}</div>
    <div style="margin-top:10px"><a class="file-button" data-variant="secondary" href="${folder(COUNCIL_ID)}" target="_blank" rel="noreferrer">פתחי את תיקיית המועצה בדרייב</a></div></section>`:''}`;
}
function subjectPageHtml(subj){
  const list=subjectSummaries(subj.name);
  const studied=store.studied;
  const done=list.filter(s=>studied[s.id]).length;
  const exam=nextExamFor(subj.name);
  return `
  <div><a href="#/summaries" class="file-button back-link" data-variant="secondary">‹ סיכומים</a></div>
  <div class="subject-head"><span class="subject-head-name">${subj.name}</span></div>
  ${exam?`<div class="subj-exam" style="background:${subj.color.bg};border-color:${subj.color.border}">
    <span class="subj-exam-name">${exam.name}</span>
    <span class="subj-exam-meta">${examWeekday(exam)}, ${exam.d} ב${hebMonths[exam.m-1]}${exam.far?` ${exam.y}`:''}${exam.time?` · ${exam.time}`:''} · ${countdown(exam)}</span></div>`:''}
  ${list.length?`<section class="group"><h2 class="group-label">ההתקדמות שלי</h2>${progressHtml(done,list.length,subj.color)}</section>`:''}
  ${list.length?`<section class="group"><h2 class="group-label">הסיכומים</h2>${summaryListHtml(list)}</section>`:''}
  ${subj.id?`<div style="margin-top:14px"><a class="file-button" data-variant="secondary" href="${folder(subj.id)}" target="_blank" rel="noreferrer">פתחי את התיקייה בדרייב</a></div>`:''}`;
}
const app=document.getElementById('app');
let homeQuery='';
function setTab(name){
  document.querySelectorAll('#tabs .tab').forEach(t=>{const on=t.getAttribute('data-tab')===name;t.classList.toggle('is-active',on);if(on)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});
}
function render(){
  if(!window.userContentReady){app.innerHTML=window.onboardingHtml?window.onboardingHtml():'<h1 class="file-title">Study Coach</h1>';document.getElementById("tabs").hidden=true;if(window.bindOnboarding)window.bindOnboarding();return;}
  document.getElementById("tabs").hidden=false;
  const hash=location.hash||'#/';
  const m=hash.match(/^#\/subject\/([a-z0-9]+)$/);
  const closing=`<div class="closing">Study Coach</div>`;
  if(hash.startsWith('#/friends')){
    setTab('friends');app.innerHTML='<div id="friends-workspace"></div>';if(window.renderFriends)window.renderFriends();
  }else if(hash.startsWith('#/notebooks')){
    setTab('notebooks');app.innerHTML='<div id="notebook-workspace"></div>';if(window.renderNotebooks)window.renderNotebooks();
  }else if(hash.startsWith('#/text/')){
    setTab('summaries');app.innerHTML='<div id="text-workspace"></div>';
  }else if(hash==='#/settings'){
    setTab('settings');
    app.innerHTML=settingsHtml();
  }else if(hash==='#/exams'){
    setTab('exams');
    app.innerHTML=examsPageHtml()+closing;
  }else if(hash==='#/summaries'){
    setTab('summaries');
    app.innerHTML=summariesPageHtml()+closing;
    const input=document.getElementById('search-input');
    const below=document.getElementById('home-below');
    input.value=homeQuery;
    below.innerHTML=homeBelowHtml(homeQuery);
    bindToggles(below);
    input.addEventListener('input',()=>{homeQuery=input.value;below.innerHTML=homeBelowHtml(homeQuery);bindToggles(below);});
  }else if(m){
    setTab('summaries');
    const subj=subjects.find(s=>s.key===m[1]);
    app.innerHTML=(subj?subjectPageHtml(subj):'')+closing;
    bindToggles(app);
  }else{
    setTab('home');
    app.innerHTML=homeHtml()+closing;
  }
  window.scrollTo(0,0);
  if(window.renderLanguagePicker)window.renderLanguagePicker();
  if(window.renderRemindersCard)window.renderRemindersCard();
  if(window.renderSyncCard)window.renderSyncCard();
  if(window.renderPreferences)window.renderPreferences();
  if(window.bindAddFile)window.bindAddFile();
  if(window.bindExams)window.bindExams();
  if(window.renderFriendsSettings)window.renderFriendsSettings();
  if(window.renderOwnerAdmin)window.renderOwnerAdmin();
  if(window.bindBoardPhoto)window.bindBoardPhoto();
}
function bindToggles(root){
  root.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.getAttribute('data-toggle');
      const st=store.studied;
      const turningOn=!st[id];
      st[id]=turningOn;
      if(!turningOn)delete st[id];
      store.studied=st;
      if(window.syncLocalChanged)window.syncLocalChanged();
      if(turningOn)markStudyDay();
      render();
    });
  });
}
window.addEventListener('hashchange',render);
render();
</script>
