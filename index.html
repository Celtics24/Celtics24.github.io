<style>
:root{
  --ds-page:#fbfaf9; --ds-white:#ffffff; --ds-ink:#251f21; --ds-ink-2:#585254;
  --ds-ink-3:#969394; --ds-hairline:#eae9ea;
  --pink-50:#fff5fa; --pink-100:#ffe3ef; --pink-200:#ffc9de; --pink-300:#ff9ec4; --pink-600:#d6336c; --pink-700:#c2255c;
  --ds-elevation-1: 0 1px 2px rgb(37 31 33 / .12), 0 4px 12px rgb(37 31 33 / .14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--ds-page); color:var(--ds-ink);
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Hebrew",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.file-card{
  max-width:680px;margin:24px auto;padding:22px 20px 28px;background:var(--ds-white);
  border-radius:24px;box-shadow:var(--ds-elevation-1);
}
@media (max-width:740px){ .file-card{margin:0;border-radius:0;min-height:100vh;} }
.file-header{margin-bottom:14px}
.file-title{margin:0;font-size:28px;font-weight:800}
.file-fact{margin-top:2px;font-size:13px;color:var(--ds-ink-2)}
.group{margin-top:20px}
.group-label{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ds-ink-2)}
.caption{font-size:12px;color:var(--ds-ink-2);margin-top:8px}
.closing{margin-top:26px;text-align:center;font-size:12px;color:var(--ds-ink-3)}
.file-button{display:inline-block;font:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;
  border:1.5px solid var(--pink-300);background:var(--pink-100);color:var(--pink-700);cursor:pointer;text-decoration:none}
.file-button[data-variant="secondary"]{background:#fff}
.file-button:hover{border-color:var(--pink-600)}
.file-hover-wrap{text-decoration:none}
.file-hover-underline:hover{text-decoration:underline}
.next-exam{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;border-radius:22px;
  background:linear-gradient(135deg,var(--pink-100),var(--pink-200));border:1px solid var(--pink-300);margin-bottom:6px}
.next-label{font-size:13px;font-weight:700;color:var(--pink-700)}
.next-count-row{display:flex;align-items:baseline;gap:8px}
.next-num{font-size:52px;font-weight:800;line-height:1;color:var(--pink-700);font-variant-numeric:tabular-nums}
.next-word{font-size:20px;font-weight:700;color:var(--pink-700)}
.next-word.is-big{font-size:40px;font-weight:800;line-height:1.05}
.next-name{font-size:16px;font-weight:600;color:var(--ds-ink)}
.next-date{font-size:13px;color:var(--ds-ink-2)}
.next-link{margin-top:4px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--pink-200);border-radius:999px;padding:11px 16px;margin:14px 0 4px}
.search:focus-within{border-color:var(--pink-300)}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;background:transparent;color:var(--ds-ink)}
.search input::placeholder{color:var(--ds-ink-2)}
.no-results{font-size:14px;color:var(--ds-ink-2);text-align:center;padding:18px 0}
.pbar-wrap{display:flex;flex-direction:column;gap:6px;width:100%}
.pbar{height:10px;border-radius:999px;background:#fff;border:1px solid var(--pink-200);overflow:hidden}
.pbar>span{display:block;height:100%;background:var(--pink-600);border-radius:999px;transition:width .3s ease}
.pbar-text{font-size:12px;font-weight:600;color:var(--ds-ink-2)}
.sprint{display:flex;flex-direction:column;gap:10px}
.sprint-card{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:16px;border:1px solid transparent;text-decoration:none;color:inherit}
.sprint-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sprint-name{font-weight:700;font-size:14px;color:var(--ds-ink)}
.sprint-days{font-size:12px;font-weight:700;white-space:nowrap}
.exams{display:flex;flex-direction:column}
.exam-row{display:block;padding:12px 0;border-bottom:1px solid var(--ds-hairline);text-decoration:none;color:inherit}
.exam-row:last-child{border-bottom:0}
.exam-flex{display:flex;align-items:center;gap:14px}
.exam-date{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:6px 8px;background:var(--pink-100);border-radius:14px;color:var(--pink-700)}
.exam-date strong{font-size:20px;line-height:1.1}
.exam-date span{font-size:11px}
.exam-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.exam-name{font-weight:600;font-size:14px;color:var(--ds-ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.exam-pill{font-size:10px;font-weight:700;background:var(--pink-100);color:var(--pink-700);border-radius:999px;padding:2px 8px}
.exam-meta{font-size:12px;color:var(--ds-ink-2)}
.exam-count{font-size:13px;font-weight:600;color:var(--pink-700);white-space:nowrap}
.month{border:1px solid var(--pink-200);border-radius:16px;overflow:hidden;background:#fff}
.month-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--pink-100);color:var(--pink-700);font-size:12px;font-weight:600;text-align:center}
.month-head>div{padding:8px 0}
.month-week{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--ds-hairline)}
.month-day{min-height:52px;padding:4px 2px;text-align:center;border-inline-start:1px solid var(--ds-hairline);display:flex;flex-direction:column;align-items:center;gap:2px}
.month-day:first-child{border-inline-start:0}
.month-num{font-size:12px;font-weight:600;color:var(--ds-ink)}
.month-day.has-exam{background:var(--pink-50)}
.month-day.has-exam .month-num{color:var(--pink-700)}
.month-exam{font-size:9px;line-height:1.2;background:var(--pink-200);color:var(--pink-700);border-radius:6px;padding:1px 4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.month-day.is-today{outline:2px solid var(--pink-300);outline-offset:-2px;border-radius:8px}
.summaries{display:flex;flex-direction:column;gap:10px}
.summary-row{display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:#fff;border:1px solid var(--ds-hairline);border-radius:16px}
.summary-top{display:flex;align-items:center;gap:12px}
.summary-chip{display:flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:12px;border:1px solid transparent;font-size:20px}
.summary-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.summary-name{font-weight:600;font-size:14px;color:var(--ds-ink);text-decoration:none;align-self:flex-start}
.summary-row.is-studied .summary-name{color:var(--ds-ink-2)}
.summary-note{font-size:12px;color:var(--ds-ink-2)}
.summary-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.studied-toggle{flex-shrink:0;font:inherit;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;border:1.5px solid var(--pink-300);background:#fff;color:var(--pink-700);cursor:pointer;margin-inline-start:auto}
.studied-toggle.is-on{color:#fff;border-width:1.5px}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:768px){.subjects{grid-template-columns:repeat(4,1fr)}}
.subject{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;background:var(--pink-50);border:1px solid var(--pink-200);border-radius:16px;text-decoration:none;color:inherit}
.subject-emoji{font-size:22px}
.subject-name{font-weight:600;font-size:14px;color:var(--ds-ink)}
.subject-count{font-size:12px;color:var(--ds-ink-2)}
.back-link{align-self:flex-start;margin-bottom:12px}
.subject-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.subject-head-emoji{font-size:34px}
.subject-head-name{font-size:26px;font-weight:800;color:var(--ds-ink)}
.subj-exam{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:16px;border:1px solid transparent;margin-bottom:14px}
.subj-exam-name{font-weight:700;font-size:15px;color:var(--ds-ink)}
.subj-exam-meta{font-size:13px;color:var(--ds-ink-2)}
.hero-wrap{max-width:460px;margin:0 auto;border-radius:24px;overflow:hidden;border:1.5px solid var(--pink-200);background:#f0ebef;box-shadow:0 6px 20px rgb(214 51 108 / .10)}
.hero-wrap img{display:block;width:100%;height:auto}
.streak-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--pink-50),var(--pink-100));border:1.5px solid var(--pink-200);border-radius:22px;padding:14px 18px;margin-top:14px}
@keyframes streak-pop{0%{transform:scale(.35);opacity:.2}60%{transform:scale(1.22);opacity:1}100%{transform:scale(1)}}
.streak-flame{font-size:30px;animation:streak-pop .6s ease}
.streak-num{font-size:34px;font-weight:800;color:var(--pink-700);min-width:42px;text-align:center;animation:streak-pop .5s ease}
.streak-text{display:flex;flex-direction:column;gap:2px}
.streak-label{font-weight:700}
.streak-best{font-size:12.5px;color:var(--pink-600)}
.reminders-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff8dd,#ffefd9);border:1.5px solid #f3e7b4;border-radius:22px;padding:14px 18px;margin-top:14px}
.reminders-emoji{font-size:26px}
.reminders-text{flex:1;display:flex;flex-direction:column;gap:2px}
.reminders-title{font-weight:700}
.reminders-sub{font-size:12.5px;color:#8a6d3b}
.reminders-btn{border:1.5px solid var(--pink-200);background:#fff;color:var(--pink-700);font-weight:700;border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}
.reminders-btn.is-on{background:var(--pink-700);border-color:var(--pink-700);color:#fff}
.reminders-btn:disabled{opacity:.6}
.streak-hint{margin-inline-start:auto;font-size:11px;color:#c49bae;text-align:left}
.hero-gap{margin-top:14px}
</style>
</head>

function daysUntil(ex){const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();const target=new Date(ex.y,ex.m-1,ex.d).getTime();return Math.round((target-today)/86400000);}
function countdown(ex){const d=daysUntil(ex);if(d<0)return 'עבר';if(d===0)return 'היום!';if(d===1)return 'מחר!';return `עוד ${d} ימים`;}
function examWeekday(ex){return `יום ${hebDays[new Date(ex.y,ex.m-1,ex.d).getDay()]}`;}
function subjectSummaries(n){return summaries.filter(s=>s.subject===n);}
function nextExamFor(n){return exams.filter(ex=>ex.subject===n&&daysUntil(ex)>=0).sort((a,b)=>daysUntil(a)-daysUntil(b))[0];}
const IL_DAY=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem'});
function todayKey(){return IL_DAY.format(new Date());}
function shiftDayKey(key,delta){const [y,m,d]=key.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+delta)).toISOString().slice(0,10);}
function computeStreaks(days){
  const set=new Set(Object.keys(days).filter(k=>days[k]));
  let cursor=set.has(todayKey())?todayKey():shiftDayKey(todayKey(),-1);
  let current=0;
  while(set.has(cursor)){current++;cursor=shiftDayKey(cursor,-1);}
  let best=0,run=0,prev='';
  for(const k of [...set].sort()){run=prev&&k===shiftDayKey(prev,1)?run+1:1;if(run>best)best=run;prev=k;}
  return {current,best};
}
const store={
  get studied(){try{return JSON.parse(localStorage.getItem('studied.v1')||'{}')}catch(e){return {}}},

  get days(){try{return JSON.parse(localStorage.getItem('studyDays.v1')||'{}')}catch(e){return {}}},
  set days(v){localStorage.setItem('studyDays.v1',JSON.stringify(v))},
};
function markStudyDay(){const d=store.days;d[todayKey()]=true;store.days=d;
  if(window.reportStudyDay){const {current}=computeStreaks(d);window.reportStudyDay(todayKey(),current);}}

function streakHtml(){

}
function nextExamHtml(){
  const upcoming=exams.filter(ex=>!ex.far&&daysUntil(ex)>=0);
  if(!upcoming.length)return '';
  const min=Math.min(...upcoming.map(daysUntil));
  const sameDay=upcoming.filter(ex=>daysUntil(ex)===min);
  const first=sameDay[0];
  return `<div class="next-exam"><span class="next-label">המבחן הקרוב 🎯</span>
    <div class="next-count-row">${min>1?`<span class="next-num">${min}</span><span class="next-word">ימים</span>`:min===1?`<span class="next-word is-big">מחר!</span>`:`<span class="next-word is-big">היום! בהצלחה 🍀</span>`}</div>
    <span class="next-name">${sameDay.map(ex=>ex.name).join(' + ')}</span>
    <span class="next-date">${examWeekday(first)}, ${first.d} ב${hebMonths[first.m-1]}${first.time?` · ${first.time}`:''}</span>
    ${first.url?`<a class="file-button next-link" href="${first.url}" target="_blank" rel="noreferrer">${first.hasSummary?'פתחי את הסיכום 📖':'פתחי את תיקיית המקצוע'}</a>`:''}
  </div>`;
}
function progressHtml(done,total,color){
  const pct=total>0?Math.round(done/total*100):0;
  return `<div class="pbar-wrap"><div class="pbar" style="border-color:${color.border}" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span style="width:${pct}%;background:${color.accent}"></span></div><span class="pbar-text">${total>0?`למדת ${done} מתוך ${total} סיכומים · ${pct}%`:'עוד אין סיכומים במקצוע'}</span></div>`;
}
function sprintHtml(){
  const studied=store.studied;
  const inWindow=exams.filter(ex=>ex.subject&&!ex.far&&daysUntil(ex)>=0&&daysUntil(ex)<=PROGRESS_DAYS);
  if(!inWindow.length)return '';
  const cards=inWindow.map(ex=>{
    const subj=subjects.find(s=>s.name===ex.subject);
    const list=subjectSummaries(ex.subject);
    const done=list.filter(s=>studied[s.id]).length;
    const days=daysUntil(ex);
    return `<a href="#/subject/${subj.key}" class="sprint-card" style="background:${subj.color.bg};border-color:${subj.color.border}">
      <span class="sprint-head"><span class="sprint-name">${subj.emoji} ${ex.name}</span><span class="sprint-days" style="color:${subj.color.accent}">${days===0?'היום!':days===1?'מחר!':`עוד ${days} ימים`}</span></span>
      ${progressHtml(done,list.length,subj.color)}</a>`;
  }).join('');
  return `<section class="group"><h2 class="group-label">הספרינט האחרון ⏳</h2><div class="sprint">${cards}</div></section>`;
}
function monthWeeks(y,m){
  const first=new Date(y,m-1,1);const days=new Date(y,m,0).getDate();
  const weeks=[];let week=new Array(first.getDay()).fill(null);
  for(let d=1;d<=days;d++){week.push(d);if(week.length===7){weeks.push(week);week=[];}}
  if(week.length){while(week.length<7)week.push(null);weeks.push(week);}
  return weeks;
}

function novemberHtml(){
  const weeks=monthWeeks(2026,11);

  const isThisMonth=now.getFullYear()===2026&&now.getMonth()===10;
  const today=now.getDate();
  const head=hebDays.map(d=>`<div>${d}</div>`).join('');
  const body=weeks.map(week=>`<div class="month-week">${week.map(day=>{
    const marks=day?novExams[day]:undefined;
    const cls=['month-day',day===null?'is-empty':'',marks?'has-exam':'',isThisMonth&&day===today?'is-today':''].join(' ');
    return `<div class="${cls}">${day!==null?`<span class="month-num">${day}</span>`:''}${marks?marks.map(mk=>`<span class="month-exam" style="background:${mk.c.bg};color:${mk.c.accent}">${mk.t}</span>`).join(''):''}</div>`;
  }).join('')}</div>`).join('');
  return `<div class="month" role="table" aria-label="יומן נובמבר 2026"><div class="month-head" role="row">${head}</div>${body}</div>`;
}

}

    app.innerHTML=(subj?subjectPageHtml(subj):'')+`<div class="closing">הדף עודכן ב-18.10.2026</div>`;
  }else{

    const below=document.getElementById('home-below');

    bindToggles(app);
  }

function bindToggles(root){
  root.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.getAttribute('data-toggle');
      const st=store.studied;
      const turningOn=!st[id];
      st[id]=turningOn;
      if(!turningOn)delete st[id];
      store.studied=st;
      if(turningOn)markStudyDay();
      render();
    });
  });
}
