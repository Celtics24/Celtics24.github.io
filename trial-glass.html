<!doctype html>
<html lang="he" dir="rtl" data-theme="pink" data-style="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>דף ניסיון - צבעי זכוכית</title>
<link rel="stylesheet" href="inkbook-fonts.css?v=20261105">
<style>
/* ===== ערכות הצבע של Study Coach, בדיוק כמו באפליקציה (index.html) ===== */
:root,:root[data-theme=pink]{--ds-page:#FFECEE;--ds-white:#ffffff;--ds-ink:#55323F;--ds-ink-2:#694351;--ds-ink-3:#694351;--ds-hairline:#FEBDCE;--pink-50:#FFECEE;--pink-100:#FFE0E6;--pink-200:#FFD4DE;--pink-300:#FFC9D6;--pink-600:#55323F;--pink-700:#55323F;--cover:#FFD4DE;--spine:#FEBDCE;--bookmark:#55323F;--paper:#fff;--page-rule:#FFE0E6}
:root[data-theme=blue]{--ds-page:#DBECF4;--ds-white:#fff;--ds-ink:#194569;--ds-ink-2:#194569;--ds-ink-3:#194569;--ds-hairline:#91AEC4;--pink-50:#DBECF4;--pink-100:#CADEED;--pink-200:#B7D0E1;--pink-300:#91AEC4;--pink-600:#194569;--pink-700:#194569;--cover:#91AEC4;--spine:#5F84A2;--bookmark:#194569;--paper:#fff;--page-rule:#DBECF4}
:root[data-theme=purple]{--ds-page:#E0B6E4;--ds-white:#fff;--ds-ink:#47034E;--ds-ink-2:#5D0565;--ds-ink-3:#5D0565;--ds-hairline:#9F5EA5;--pink-50:#E0B6E4;--pink-100:#E0B6E4;--pink-200:#9F5EA5;--pink-300:#7E3285;--pink-600:#5D0565;--pink-700:#47034E;--cover:#7E3285;--spine:#5D0565;--bookmark:#47034E;--paper:#fff;--page-rule:#E0B6E4}
:root[data-theme=mint]{--ds-page:#DDEAD1;--ds-white:#fff;--ds-ink:#4B6043;--ds-ink-2:#4B6043;--ds-ink-3:#4B6043;--ds-hairline:#A3C585;--pink-50:#DDEAD1;--pink-100:#C7DDB5;--pink-200:#B3CF99;--pink-300:#95BB72;--pink-600:#658354;--pink-700:#4B6043;--cover:#95BB72;--spine:#75975E;--bookmark:#4B6043;--paper:#fff;--page-rule:#DDEAD1}
:root[data-theme=burgundy]{--ds-page:#D77A7D;--ds-white:#fff;--ds-ink:#461220;--ds-ink-2:#461220;--ds-ink-3:#461220;--ds-hairline:#B23A48;--pink-50:#D77A7D;--pink-100:#D77A7D;--pink-200:#B23A48;--pink-300:#8C2F39;--pink-600:#69212D;--pink-700:#461220;--cover:#B23A48;--spine:#8C2F39;--bookmark:#461220;--paper:#fff;--page-rule:#f1dada}
:root[data-theme=dark]{color-scheme:dark;--ds-page:#0A1C3A;--ds-white:#1A2D55;--ds-ink:#D4D4D8;--ds-ink-2:#D4D4D8;--ds-ink-3:#A1A5BE;--ds-hairline:#505D89;--pink-50:#0A1C3A;--pink-100:#1A2D55;--pink-200:#32436F;--pink-300:#505D89;--pink-600:#D4D4D8;--pink-700:#D4D4D8;--cover:#32436F;--spine:#505D89;--bookmark:#A1A5BE;--paper:#1A2D55;--page-rule:#32436F}

/* ===== בסיס כמו באפליקציה ===== */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ds-page);color:var(--ds-ink);font-family:Assistant,Felix007,-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.file-card{max-width:680px;margin:24px auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px calc(104px + env(safe-area-inset-bottom,0px));background:var(--ds-page);border-radius:24px}
@media (max-width:740px){.file-card{margin:0;border-radius:0}}
.file-title{margin:0;font-size:28px;font-weight:600;letter-spacing:-.4px}
.file-fact{margin-top:2px;font-size:13px;color:var(--ds-ink-2)}
.group{margin-top:20px}
.group-label{margin:0 0 8px;font-size:17px;font-weight:500}

/* רכיבים — המראה הנוכחי של האפליקציה */
.file-button{display:inline-block;font:inherit;font-size:15px;font-weight:500;padding:9px 16px;min-height:44px;border-radius:11px;border:1.5px solid var(--pink-300);background:var(--pink-100);color:var(--pink-700);cursor:pointer;text-decoration:none}
.file-button[data-variant="secondary"]{background:var(--ds-white)}
.file-button.pri{background:var(--pink-700);color:var(--ds-page);border-color:var(--pink-700)}
.next-exam{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;border-radius:18px;background:var(--pink-100);border:1px solid var(--pink-200);margin-bottom:6px}
.next-label{font-size:13px;font-weight:700;color:var(--pink-700)}
.next-count-row{display:flex;align-items:baseline;gap:8px}
.next-num{font-size:42px;font-weight:600;line-height:1;color:var(--pink-700);font-variant-numeric:tabular-nums}
.next-word{font-size:20px;font-weight:600;color:var(--pink-700)}
.next-name{font-size:16px;font-weight:600;color:var(--ds-ink)}
.next-date{font-size:13px;color:var(--ds-ink-2)}
.streak-card{display:flex;align-items:center;gap:12px;background:var(--pink-100);border:1px solid var(--pink-200);border-radius:18px;padding:14px 18px;margin-top:18px}
.streak-num{font-size:34px;font-weight:600;color:var(--pink-700)}
.streak-label{font-size:15px;font-weight:600}
.streak-best{font-size:13px;color:var(--ds-ink-2)}
.last-nb{display:flex;align-items:center;gap:14px;margin-top:18px;padding:14px 16px;border-radius:18px;border:1px solid var(--pink-200);background:var(--ds-white);color:var(--ds-ink);text-decoration:none}
.last-nb .ico{width:36px;height:42px;flex:none;border-inline-start:3px solid var(--pink-700);padding-inline-start:5px}
.last-nb-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.last-nb-text strong{font-size:17px;font-weight:500;overflow-wrap:anywhere}
.last-nb-text small{font-size:12px;color:var(--ds-ink-2)}
.chat-home{display:flex;align-items:center;gap:14px;min-height:150px;padding:22px;margin:0 0 20px;border-radius:18px;border:1px solid var(--pink-200);background:var(--pink-100);color:var(--ds-ink);text-decoration:none}
.chat-home strong{font-size:31px;font-weight:600;direction:ltr}
.chat-home>span:last-child{margin-inline-start:auto;font-size:25px;color:var(--pink-700)}
.nb-hero-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px;padding:12px 2px 4px}
.notebook-hero{position:relative;display:flex;min-height:204px;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:24px 20px 20px 28px;border:0;border-radius:8px 18px 18px 8px;background:var(--pink-100);color:var(--pink-700);font:inherit;text-align:start;box-shadow:inset 9px 0 0 #00000012,0 7px 0 -3px var(--ds-white),0 9px 0 -3px var(--pink-200),0 13px 18px -12px #442d4b66}
.notebook-hero:before{content:'';position:absolute;left:16px;top:0;bottom:0;border-left:1px solid #ffffff80}
.notebook-hero strong{font-size:19px;line-height:1.45}
.notebook-hero small{font-size:12px;opacity:.8}
.nb-cover-mark{font-size:30px;opacity:.65}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.tabs-inner{pointer-events:auto;width:100%;max-width:680px;display:flex;gap:3px;background:var(--ds-white);border-top:1px solid var(--pink-200);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:11px;text-decoration:none;color:var(--ds-ink-2);font-size:13px;font-weight:500}
.tab-ico{width:24px;height:24px;fill:none;stroke:var(--pink-600);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab.is-active{color:var(--pink-700);background:var(--pink-100);font-weight:600}

/* בורר הניסיון */
.trial-note{max-width:640px;margin:0 auto;padding:10px 14px;font-size:14px;color:var(--ds-ink-2);text-align:center}
.controls{max-width:680px;margin:0 auto;padding:0 14px;display:grid;gap:10px}
.pals{display:flex;flex-wrap:wrap;gap:6px}
.pal{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px 0 8px;border-radius:99px;background:var(--ds-white);box-shadow:inset 0 0 0 1px var(--pink-200);font-size:14px;font-weight:500;color:var(--ds-ink)}
.pal.on{box-shadow:inset 0 0 0 2px var(--pink-700)}
.sw{display:flex;border-radius:99px;overflow:hidden;width:40px;height:16px}
.sw i{flex:1}
.support-line{font-size:12.5px;color:var(--ds-ink-2)}

/* ============================================================
   שכבת הזכוכית (Liquid Glass) — על פי החילוץ מאפליקציית אבא,
   מותאם למחלקות ולמשתני הצבע של Study Coach
   ============================================================ */
:root[data-style=glass]{
  --glass-hi:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.14));
  --glass-hi-deep:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 60%);
  --glass-rim:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.75));
  --glass-sh:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px rgba(30,45,75,.08),0 8px 20px -10px rgba(30,45,75,.35);
}
:root[data-style=glass] .file-button,
:root[data-style=glass] .next-exam,
:root[data-style=glass] .streak-card,
:root[data-style=glass] .last-nb,
:root[data-style=glass] .chat-home,
:root[data-style=glass] .notebook-hero,
:root[data-style=glass] .tabs-inner,
:root[data-style=glass] .pal{
  border:1px solid transparent;
  background:var(--glass-hi) padding-box,linear-gradient(var(--g,color-mix(in srgb,var(--pink-100) 72%,transparent)),var(--g,color-mix(in srgb,var(--pink-100) 72%,transparent))) padding-box,var(--glass-rim) border-box;
  box-shadow:var(--glass-sh);
  -webkit-backdrop-filter:blur(10px) saturate(1.5);
  backdrop-filter:blur(10px) saturate(1.5);
}
:root[data-style=glass] .file-button[data-variant="secondary"],
:root[data-style=glass] .last-nb,
:root[data-style=glass] .tabs-inner,
:root[data-style=glass] .pal{--g:color-mix(in srgb,var(--ds-white) 74%,transparent)}
:root[data-style=glass] .notebook-hero{--g:color-mix(in srgb,var(--pink-100) 66%,transparent)}
:root[data-style=glass] .file-button.pri,
:root[data-style=glass] .tab.is-active{
  border:1px solid transparent;
  background:var(--glass-hi-deep) padding-box,linear-gradient(var(--pink-700),var(--pink-700)) padding-box,var(--glass-rim) border-box;
  box-shadow:var(--glass-sh);
  -webkit-backdrop-filter:blur(10px) saturate(1.5);
  backdrop-filter:blur(10px) saturate(1.5);
  color:var(--ds-page);
}
:root[data-style=glass] .tab.is-active .tab-ico{stroke:var(--ds-page)}
:root[data-style=glass] .file-button.pri{color:var(--ds-page)}
:root[data-style=glass] .pal.on{box-shadow:var(--glass-sh),0 0 0 2px var(--pink-700)}
/* נגישות: שקיפות מופחתת — רכיבים אטומים */
@media (prefers-reduced-transparency:reduce){
  :root[data-style=glass] .file-button,:root[data-style=glass] .next-exam,:root[data-style=glass] .streak-card,:root[data-style=glass] .last-nb,:root[data-style=glass] .chat-home,:root[data-style=glass] .notebook-hero,:root[data-style=glass] .tabs-inner,:root[data-style=glass] .pal{-webkit-backdrop-filter:none;backdrop-filter:none}
}
/* רקע גוף בסגנון זכוכית: הילות צבע מהערכה — מתכון הרקע של אבא עם המשתנים שלנו */
:root[data-style=glass] body{
  background-image:
    radial-gradient(ellipse at 12% 8%,color-mix(in srgb,var(--pink-200) 80%,transparent),transparent 50%),
    radial-gradient(ellipse at 88% 22%,color-mix(in srgb,var(--pink-100) 75%,transparent),transparent 45%),
    radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--pink-300) 60%,transparent),transparent 55%),
    linear-gradient(165deg,color-mix(in srgb,var(--pink-700) 14%,var(--ds-page)),var(--ds-page) 55%);
  background-attachment:fixed;
}
</style>
</head>
<body>
<p class="trial-note">דף ניסיון בלבד לעיצוב "זכוכית" בצבעים של Study Coach, עם תוכן לדוגמה. האפליקציה עצמה לא השתנתה.</p>
<div class="controls">
  <div class="pals" id="pals"></div>
  <div class="pals">
    <button class="pal" id="glass-toggle" aria-pressed="true"><span class="sw"><i style="background:linear-gradient(135deg,#fff,rgba(255,255,255,.2) 55%,#bcd6ee)"></i></span><span id="glass-label">זכוכית: מופעל</span></button>
  </div>
  <p class="support-line" id="support"></p>
</div>

<main class="file-card">
  <a class="chat-home" href="#">
    <svg class="tab-ico" viewBox="0 0 24 24" style="width:38px;height:38px"><path d="M12 3a7 7 0 0 1 7 7c0 2-1 3.7-2.3 4.9L17 21l-3.2-1.6c-.6.1-1.2.1-1.8.1a7 7 0 0 1-7-7 7 7 0 0 1 7-7Z"/></svg>
    <span class="last-nb-text"><strong>ai coach</strong></span>
    <span>‹</span>
  </a>

  <section class="next-exam">
    <span class="next-label">המבחן הבא</span>
    <div class="next-count-row"><span class="next-num">3</span><span class="next-word">ימים</span></div>
    <span class="next-name">סוציולוגיה — יחידה 2</span>
    <span class="next-date">יום רביעי, 11.11.2026</span>
  </section>

  <section class="streak-card">
    <span class="streak-num">4</span>
    <span class="last-nb-text"><span class="streak-label">ימי רצף</span><span class="streak-best">השיא שלך: 9</span></span>
  </section>

  <a class="last-nb" href="#">
    <svg class="tab-ico ico" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M9 8h6M9 12h6"/></svg>
    <span class="last-nb-text"><strong>המחברת האחרונה</strong><small>מתמטיקה · 4 דפים</small></span>
  </a>

  <div class="group">
    <p class="group-label">המחברות</p>
    <div class="nb-hero-wrap">
      <button class="notebook-hero"><span class="nb-cover-mark">✎</span><strong>אנטומיה</strong><small>6 דפים</small></button>
      <button class="notebook-hero"><span class="nb-cover-mark">✎</span><strong>מתמטיקה</strong><small>4 דפים</small></button>
    </div>
  </div>

  <div class="group">
    <p class="group-label">כפתורים</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="file-button pri">שמירה</button>
      <button class="file-button">הוספת קובץ</button>
      <button class="file-button" data-variant="secondary">צילום ל-PDF</button>
    </div>
  </div>
</main>

<nav id="tabs"><div class="tabs-inner">
  <a class="tab is-active" href="#"><svg class="tab-ico" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-6v-5h-4v5H4Z"/></svg>בית</a>
  <a class="tab" href="#"><svg class="tab-ico" viewBox="0 0 24 24"><path d="M5 5h6v14H7a2 2 0 0 1-2-2V5ZM13 5h6v12a2 2 0 0 1-2 2h-4V5Z"/></svg>סיכומים</a>
  <a class="tab" href="#"><svg class="tab-ico" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>מבחנים</a>
  <a class="tab" href="#"><svg class="tab-ico" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M9 8h6M9 12h6"/></svg>מחברות</a>
  <a class="tab" href="#"><svg class="tab-ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 5a3 3 0 0 1 0 6M17.5 14.5a5.5 5.5 0 0 1 3 5.5"/></svg>חברים</a>
  <a class="tab" href="#"><svg class="tab-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>הגדרות</a>
</div></nav>

<script>
/* ערכות Study Coach לבורר — שם + שלוש דוגמיות צבע מתוך הערכה עצמה */
const THEMES = {
  pink:     { n: 'ורוד',      sw: ['#FFE0E6', '#FFD4DE', '#55323F'] },
  blue:     { n: 'כחול',      sw: ['#CADEED', '#B7D0E1', '#194569'] },
  purple:   { n: 'סגול',      sw: ['#E0B6E4', '#9F5EA5', '#47034E'] },
  mint:     { n: 'ירוק מנטה', sw: ['#C7DDB5', '#95BB72', '#4B6043'] },
  burgundy: { n: 'אדום',      sw: ['#D77A7D', '#B23A48', '#461220'] },
  dark:     { n: 'כהה',       sw: ['#1A2D55', '#32436F', '#D4D4D8'] },
};
let current = 'pink';
const pals = document.getElementById('pals');
const renderPals = () => {
  pals.innerHTML = Object.entries(THEMES).map(([k, t]) =>
    `<button class="pal${k === current ? ' on' : ''}" data-theme="${k}" aria-pressed="${k === current}">` +
    `<span class="sw">${t.sw.map(c => `<i style="background:${c}"></i>`).join('')}</span>${t.n}</button>`
  ).join('');
};
pals.addEventListener('click', e => {
  const b = e.target.closest('[data-theme]');
  if (!b) return;
  current = b.dataset.theme;
  document.documentElement.dataset.theme = current;
  renderPals();
});
renderPals();

const toggle = document.getElementById('glass-toggle');
const label = document.getElementById('glass-label');
toggle.addEventListener('click', () => {
  const on = document.documentElement.dataset.style !== 'glass';
  document.documentElement.dataset.style = on ? 'glass' : '';
  toggle.setAttribute('aria-pressed', String(on));
  label.textContent = 'זכוכית: ' + (on ? 'מופעל' : 'כבוי');
});

/* בדיקת תמיכה כפי שהמדריך של אבא ממליץ */
const s1 = CSS.supports('backdrop-filter', 'blur(1px)') || CSS.supports('-webkit-backdrop-filter', 'blur(1px)');
const s2 = CSS.supports('color', 'color-mix(in srgb, red 50%, blue)');
document.getElementById('support').textContent =
  'תמיכת הדפדפן: טשטוש זכוכית ' + (s1 ? '✓' : '✗') + ' · ערבוב צבעים ' + (s2 ? '✓' : '✗');
</script>
</body>
</html>
