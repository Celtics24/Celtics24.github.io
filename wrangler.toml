# Reference config - the main path is the Cloudflare dashboard (no CLI needed),
# but this documents the setup if wrangler is ever used.
name = "study-coach-push"
main = "worker.js"
compatibility_date = "2026-10-20"

[triggers]
# Runs at several UTC hours; the worker itself acts only on 07:00 / 18:00 / 20:00
# Israel time, so this stays correct across daylight-saving changes.
crons = ["0 4,5,15,16,17,18 * * *"]

[[kv_namespaces]]
binding = "SUBS"
id = "KV_NAMESPACE_ID_FROM_DASHBOARD"

[vars]
